name: Product CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.17.1
        run_install: false

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.x'
        cache: pnpm
        cache-dependency-path: WebUi/pnpm-lock.yaml

    - name: Install Web UI dependencies
      working-directory: WebUi
      run: pnpm install --frozen-lockfile

    - name: Web lint
      working-directory: WebUi
      run: pnpm lint

    - name: Web typecheck
      working-directory: WebUi
      run: pnpm typecheck

    - name: Web contract tests
      working-directory: WebUi
      run: |
        pnpm test:roles
        pnpm test:i18n

    - name: Build Web UI
      working-directory: WebUi
      run: pnpm build

    - name: Verify Web UI export
      shell: pwsh
      run: |
        if (-not (Test-Path -LiteralPath "WebUi/out/index.html" -PathType Leaf)) {
          throw "WebUi static export is missing."
        }

    - name: Web visible surface contract
      working-directory: WebUi
      run: pnpm test:surface

    - name: Enforce zero browser network egress
      shell: pwsh
      run: ./eng/web-egress-gate.ps1

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '8.0.x'

    - name: Verify UTF-8 source
      shell: pwsh
      run: ./eng/verify-utf8.ps1

    - name: Restore .NET
      run: dotnet restore "币安量化机器人.sln"

    - name: Build .NET
      run: dotnet build "币安量化机器人.sln" --configuration Release --no-restore

    - name: Verify portable runtime target
      run: dotnet build "币安量化机器人.csproj" --configuration Release --framework net8.0 --no-restore

    - name: Publish headless candidate
      run: dotnet publish "WPE.Headless/WPE.Headless.csproj" --configuration Release --framework net8.0 --no-restore --output artifacts/headless

    - name: Verify headless boundary
      shell: pwsh
      run: |
        if (-not (Test-Path -LiteralPath "artifacts/headless/WPE-Headless.dll" -PathType Leaf)) {
          throw "Headless runtime assembly is missing."
        }
        if (-not (Test-Path -LiteralPath "artifacts/headless/Resources/i18n/zh_CN.json" -PathType Leaf)) {
          throw "Headless localization resources are missing."
        }
        if (Test-Path -LiteralPath "artifacts/headless/WebUi") {
          throw "Desktop Web UI entered the headless artifact."
        }
        $deps = Get-Content -Raw -LiteralPath "artifacts/headless/WPE-Headless.deps.json"
        foreach ($forbiddenDependency in @("Microsoft.WindowsDesktop.App", "Microsoft.Web.WebView2", "ScottPlot.WPF", "PresentationFramework")) {
          if ($deps.Contains($forbiddenDependency, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Headless artifact contains forbidden presentation dependency: $forbiddenDependency"
          }
        }
        $forbidden = Get-ChildItem artifacts/headless -Recurse -File | Where-Object {
          $name = $_.Name.ToLowerInvariant()
          $extension = $_.Extension.ToLowerInvariant()
          $knownState = $name -match '^(agent-settings|appsettings|order-state|local-accounts|local-session|device-license|llm-calls|llm-cache)'
          $secretData = ($name.Contains("secrets") -or $name.Contains("credentials")) -and
            @(".json", ".dat", ".txt", ".xml", ".yaml", ".yml") -contains $extension
          $knownState -or $secretData -or
          @(".db", ".sqlite", ".sqlite3", ".pem", ".key", ".p12", ".pfx") -contains $extension -or
          $name.EndsWith(".db-wal") -or $name.EndsWith(".db-shm") -or
          $name.EndsWith(".sqlite-wal") -or $name.EndsWith(".sqlite-shm") -or
          $name.EndsWith(".sqlite3-wal") -or $name.EndsWith(".sqlite3-shm")
        }
        if ($forbidden) { throw "Forbidden runtime or secret files entered headless output: $($forbidden.FullName -join ', ')" }

    - name: Test .NET
      shell: pwsh
      run: ./eng/test.ps1 -Configuration Release

    - name: Verify soak evidence harness
      shell: pwsh
      run: ./eng/ops/tests/HeadlessSoak.Tests.ps1

    - name: Verify dogfood release slots
      shell: pwsh
      run: ./eng/dogfood/tests/ReleaseSlots.Tests.ps1

    - name: Publish maintenance candidate
      run: dotnet publish "WPE.Maintenance/WPE.Maintenance.csproj" --configuration Release --no-restore --output artifacts/maintenance

    - name: Verify maintenance artifact boundary
      shell: pwsh
      run: |
        if (-not (Get-ChildItem artifacts/maintenance -Filter WPE.Maintenance.exe)) {
          throw "Maintenance executable is missing."
        }
        if (Test-Path -LiteralPath "artifacts/maintenance/WebUi") {
          throw "Maintenance artifact must not contain WebUi."
        }
        $deps = Get-Content -LiteralPath "artifacts/maintenance/WPE.Maintenance.deps.json" -Raw
        foreach ($forbiddenDependency in @("Microsoft.Web.WebView2", "ScottPlot.WPF", "Microsoft.WindowsDesktop.App")) {
          if ($deps.Contains($forbiddenDependency, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Maintenance artifact contains forbidden presentation dependency: $forbiddenDependency"
          }
        }
        $forbiddenExtensions = @(".db", ".sqlite", ".sqlite3", ".pem", ".key", ".p12", ".pfx")
        $forbiddenSuffixes = @(".db-wal", ".db-shm", ".sqlite-wal", ".sqlite-shm", ".sqlite3-wal", ".sqlite3-shm")
        $forbidden = Get-ChildItem artifacts/maintenance -Recurse -File | Where-Object {
          $lowerName = $_.Name.ToLowerInvariant()
          $extension = $_.Extension.ToLowerInvariant()
          $knownState = $lowerName -match '^(agent-settings|appsettings|order-state|local-accounts|local-session|device-license|llm-calls|llm-cache)'
          $secretData = ($lowerName.Contains("secrets") -or $lowerName.Contains("credentials")) -and
            @(".json", ".dat", ".txt", ".xml", ".yaml", ".yml") -contains $extension
          $knownState -or $secretData -or
          $forbiddenExtensions -contains $extension -or
          ($forbiddenSuffixes | Where-Object { $lowerName.EndsWith($_) })
        }
        if ($forbidden) {
          throw "Forbidden runtime or secret files entered maintenance output: $($forbidden.FullName -join ', ')"
        }

    - name: Publish candidate
      run: dotnet publish "币安量化机器人.csproj" --configuration Release --framework net8.0-windows --no-restore --output artifacts/publish

    - name: Verify publish boundary
      shell: pwsh
      run: |
        if (-not (Get-ChildItem artifacts/publish -Filter *.exe)) { throw "Published executable is missing." }
        if (-not (Test-Path -LiteralPath "artifacts/publish/WebUi/out/index.html" -PathType Leaf)) {
          throw "Published Reference UI export is missing."
        }
        $forbidden = Get-ChildItem artifacts/publish -Recurse -File | Where-Object {
          $name = $_.Name.ToLowerInvariant()
          $extension = $_.Extension.ToLowerInvariant()
          $knownState = $name -match '^(agent-settings|appsettings|order-state|local-accounts|local-session|device-license|llm-calls|llm-cache)'
          $secretData = ($name.Contains("secrets") -or $name.Contains("credentials")) -and
            @(".json", ".dat", ".txt", ".xml", ".yaml", ".yml") -contains $extension
          $knownState -or $secretData -or
          $extension -match '^\.(db|sqlite|sqlite3|pem|key|p12|pfx)
        if ($forbidden) { throw "Forbidden runtime or secret files entered publish output: $($forbidden.FullName -join ', ')" }
 -or
          $name -match '\.(db|sqlite|sqlite3)-(wal|shm)
        if ($forbidden) { throw "Forbidden runtime or secret files entered publish output: $($forbidden.FullName -join ', ')" }

        }
        if ($forbidden) { throw "Forbidden runtime or secret files entered publish output: $($forbidden.FullName -join ', ')" }
