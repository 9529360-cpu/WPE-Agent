name: Lockfile refresh once

on:
  push:
    branches: [ codex/security-dependency-upgrade-v2 ]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.ref_name }}
        persist-credentials: true

    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.17.1
        run_install: false

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.x'

    - name: Regenerate lockfile without package scripts
      working-directory: WebUi
      run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

    - name: Audit regenerated dependency graph
      working-directory: WebUi
      run: pnpm audit --audit-level=low

    - name: Commit only the regenerated lockfile
      shell: pwsh
      run: |
        $other = @(git status --porcelain | Where-Object { $_ -notmatch '^.. WebUi/pnpm-lock\.yaml$' })
        if ($other.Count -gt 0) {
          throw "Unexpected files changed during lockfile refresh: $($other -join ', ')"
        }
        git diff --quiet -- WebUi/pnpm-lock.yaml
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Lockfile already current."
          exit 0
        }
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- WebUi/pnpm-lock.yaml
        git commit -m "deps: refresh pnpm lockfile"
        git push origin "HEAD:${{ github.ref_name }}"
