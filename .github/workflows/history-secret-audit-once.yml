name: History secret audit once

on:
  push:
    branches: [ codex/security-dependency-upgrade ]
    paths: [ .github/workflows/history-secret-audit-once.yml ]

permissions:
  contents: read

jobs:
  audit-history:
    if: github.repository == '9529360-cpu/WPE-Agent' && github.ref == 'refs/heads/codex/security-dependency-upgrade'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Scan reachable Git history without printing secret values
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $rules = @(
          @{ Name = 'private-key-pem'; Pattern = '-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' },
          @{ Name = 'openai-style-token'; Pattern = '(?<![A-Za-z0-9])sk-[A-Za-z0-9_-]{20,}' },
          @{ Name = 'github-token'; Pattern = 'gh[pousr]_[A-Za-z0-9]{20,}' },
          @{ Name = 'aws-access-key'; Pattern = 'AKIA[0-9A-Z]{16}' },
          @{ Name = 'google-api-key'; Pattern = 'AIza[0-9A-Za-z_-]{35}' },
          @{ Name = 'telegram-bot-token'; Pattern = '(?<![0-9])[0-9]{8,12}:[A-Za-z0-9_-]{30,}' },
          @{ Name = 'slack-token'; Pattern = 'xox[baprs]-[A-Za-z0-9-]{20,}' },
          @{ Name = 'generic-api-secret-assignment'; Pattern = '(?im)(api[_ -]?(?:key|secret)|secret[_ -]?key)\s*[:=]\s*["'']?[A-Za-z0-9/+_-]{24,}' }
        )
        $sensitivePath = '(?i)(^|/)(\.env($|\.)|[^/]+\.(pfx|p12|pem|key)$|agent-settings[^/]*\.json$|appsettings[^/]*\.json$|order-state[^/]*\.json$|[^/]+\.(db|sqlite|sqlite3)(-wal|-shm)?$)'
        $objects = @(& git rev-list --objects --all)
        if ($LASTEXITCODE -ne 0) { throw 'Unable to enumerate Git history.' }
        $seen = [System.Collections.Generic.HashSet[string]]::new()
        $findings = [System.Collections.Generic.List[string]]::new()
        $paths = [System.Collections.Generic.List[string]]::new()

        foreach ($line in $objects) {
          $parts = $line -split ' ', 2
          if ($parts.Count -lt 2) { continue }
          $sha = $parts[0]
          $path = $parts[1]
          if ($path -match $sensitivePath) { $paths.Add("sensitive-path`t$path`t$sha") }
          if (-not $seen.Add($sha)) { continue }
          $type = (& git cat-file -t $sha 2>$null)
          if ($type -ne 'blob') { continue }
          $sizeText = (& git cat-file -s $sha 2>$null)
          $size = 0L
          if (-not [long]::TryParse([string]$sizeText, [ref]$size) -or $size -gt 1048576) { continue }
          $text = (& git cat-file -p $sha 2>$null | Out-String)
          if ($text.IndexOf([char]0) -ge 0) { continue }
          foreach ($rule in $rules) {
            if ([regex]::IsMatch($text, $rule.Pattern)) {
              $findings.Add("$($rule.Name)`t$path`t$sha")
            }
          }
        }

        Write-Host "Sensitive historical path count: $($paths.Count)"
        foreach ($item in $paths | Sort-Object -Unique) { Write-Host $item }
        Write-Host "Secret-pattern finding count: $($findings.Count)"
        foreach ($item in $findings | Sort-Object -Unique) { Write-Host $item }
        if ($findings.Count -gt 0) { throw 'Potential historical secret material found. Values were intentionally not printed.' }
