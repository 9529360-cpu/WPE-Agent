name: Remove desktop credential import once

on:
  push:
    branches: [ codex/security-remove-desktop-credential-import ]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.ref_name }}
        persist-credentials: true

    - name: Remove implicit plaintext credential discovery
      shell: pwsh
      run: |
        $utf8 = [System.Text.UTF8Encoding]::new($false)

        function Read-Text([string]$path) {
          return [System.IO.File]::ReadAllText($path)
        }

        function Write-Text([string]$path, [string]$text) {
          [System.IO.File]::WriteAllText($path, $text, $utf8)
        }

        function Replace-Exact([string]$path, [string]$old, [string]$new) {
          $text = Read-Text $path
          if (-not $text.Contains($old)) { throw "Expected text not found in $path: $old" }
          $updated = $text.Replace($old, $new)
          if ($updated -eq $text) { throw "Replacement made no change in $path" }
          Write-Text $path $updated
        }

        function Replace-Regex([string]$path, [string]$pattern, [string]$replacement) {
          $text = Read-Text $path
          $regex = [regex]::new($pattern, [System.Text.RegularExpressions.RegexOptions]::Singleline)
          $matches = $regex.Matches($text)
          if ($matches.Count -ne 1) { throw "Expected exactly one regex match in $path, got $($matches.Count): $pattern" }
          Write-Text $path ($regex.Replace($text, $replacement, 1))
        }

        $storePath = 'Services/Agent/AgentSettingsStore.cs'
        Replace-Regex $storePath '    private static readonly string\[\] DesktopTestnetCredentialFileNames =.*?    \];\r?\n' ''
        Replace-Regex $storePath '    private readonly string _desktopDirectory;\r?\n' ''
        Replace-Regex $storePath '    public AgentSettingsStore\(string\? path=null\):this\(path,null,null\)\{\}\r?\n    internal AgentSettingsStore\(string\? path,Func<DateTimeOffset>\? utcNow\):this\(path,utcNow,null\)\{\}\r?\n    internal AgentSettingsStore\(string\? path,Func<DateTimeOffset>\? utcNow,string\? desktopDirectory\)\{.*?\}\r?\n' "    public AgentSettingsStore(string? path=null):this(path,null){}`n    internal AgentSettingsStore(string? path,Func<DateTimeOffset>? utcNow){_path=path??AppDataPaths.File(`"agent-settings.json`");_utcNow=utcNow??(()=>DateTimeOffset.UtcNow);}`n"
        Replace-Regex $storePath '\r?\n    public void ImportDesktopTestnetIfEmpty\(AgentSettings settings\).*?\r?\n    public \(string Key,string Secret\) GetCredentials' "`n    public (string Key,string Secret) GetCredentials"

        Replace-Exact 'Services/AutoTradingAgent.cs' 'SettingsStore.ImportDesktopTestnetIfEmpty(settings);SettingsStore.ImportDesktopDeepSeekIfEmpty(settings);' ''
        Replace-Exact 'Services/Agent/SmokeTestRunner.cs' 'store.ImportDesktopTestnetIfEmpty(settings);if(settings.AiMode!=global::币安量化机器人.Core.Models.AiRuntimeMode.LocalOnly)store.ImportDesktopDeepSeekIfEmpty(settings);' ''
        Replace-Exact 'Services/Agent/FourPillarsTestRunner.cs' 'store.ImportDesktopTestnetIfEmpty(settings);' ''

        $testPath = 'WPE.Tests/AgentSettingsResilienceTests.cs'
        $tests = Read-Text $testPath
        $methodMarker = '    public void DesktopTestnetImport_AcceptsKnownUnicodeNamesAndPersistsOnlyEncryptedTestnetCredentials'
        $methodIndex = $tests.IndexOf($methodMarker, [StringComparison]::Ordinal)
        if ($methodIndex -lt 0) { throw 'Desktop import acceptance test marker not found.' }
        $start = $tests.LastIndexOf('    [Theory]', $methodIndex, [StringComparison]::Ordinal)
        $end = $tests.IndexOf('    public void Dispose()', $methodIndex, [StringComparison]::Ordinal)
        if ($start -lt 0 -or $end -le $start) { throw 'Could not isolate desktop import test block.' }
        $replacement = @'
    [Fact]
    public void SettingsStore_DoesNotExposeAmbientDesktopCredentialImport()
    {
        var methods = typeof(AgentSettingsStore).GetMethods(System.Reflection.BindingFlags.Instance | System.Reflection.BindingFlags.Public | System.Reflection.BindingFlags.NonPublic);

        Assert.DoesNotContain(methods, method => method.Name.StartsWith("ImportDesktop", StringComparison.Ordinal));
    }

'@
        $tests = $tests.Substring(0, $start) + $replacement + $tests.Substring($end)
        Write-Text $testPath $tests

        $matches = @(git grep -n -E 'ImportDesktop(Testnet|DeepSeek)|DesktopTestnetCredentialFileNames|_desktopDirectory' -- '*.cs')
        if ($LASTEXITCODE -eq 0 -or $matches.Count -gt 0) {
          throw "Ambient desktop credential import references remain: $($matches -join ', ')"
        }
        if ($LASTEXITCODE -ne 1) { throw "git grep failed with exit code $LASTEXITCODE" }

        $expected = @(
          'Services/Agent/AgentSettingsStore.cs',
          'Services/AutoTradingAgent.cs',
          'Services/Agent/SmokeTestRunner.cs',
          'Services/Agent/FourPillarsTestRunner.cs',
          'WPE.Tests/AgentSettingsResilienceTests.cs'
        ) | Sort-Object
        $changed = @(git diff --name-only) | Sort-Object
        if (($expected -join "`n") -ne ($changed -join "`n")) {
          throw "Unexpected rewrite surface. Expected: $($expected -join ', '); actual: $($changed -join ', ')"
        }

    - name: Commit hardened credential path
      shell: pwsh
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- Services/Agent/AgentSettingsStore.cs Services/AutoTradingAgent.cs Services/Agent/SmokeTestRunner.cs Services/Agent/FourPillarsTestRunner.cs WPE.Tests/AgentSettingsResilienceTests.cs
        git commit -m "security: remove implicit plaintext desktop credential import"
        git push origin "HEAD:${{ github.ref_name }}"
