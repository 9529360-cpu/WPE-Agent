name: .NET dependency audit once

on:
  push:
    branches: [ codex/security-dependency-upgrade ]
    paths: [ .github/workflows/dotnet-dependency-audit-once.yml ]

permissions:
  contents: read

jobs:
  audit-dotnet:
    if: github.repository == '9529360-cpu/WPE-Agent' && github.ref == 'refs/heads/codex/security-dependency-upgrade'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore "币安量化机器人.sln"
    - name: Audit direct and transitive packages
      shell: pwsh
      run: |
        dotnet list "币安量化机器人.csproj" package --include-transitive --vulnerable
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet list "WPE.Tests\WPE.Tests.csproj" package --include-transitive --vulnerable
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
