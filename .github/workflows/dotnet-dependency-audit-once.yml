name: .NET dependency audit once

on:
  push:
    branches: [ codex/security-dependency-upgrade ]
    paths: [ .github/workflows/dotnet-dependency-audit-once.yml ]

permissions:
  contents: read

jobs:
  audit-dotnet:
    if: github.repository == '9529360-cpu/WPE-Agent' && github.ref == 'refs/heads/codex/security-dependency-upgrade'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore "币安量化机器人.sln"
    - name: Enforce clean direct and transitive package graph
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($project in @('币安量化机器人.csproj', 'WPE.Tests\WPE.Tests.csproj')) {
          $output = (& dotnet list $project package --include-transitive --vulnerable 2>&1 | Out-String)
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -match 'has the following vulnerable packages') {
            throw "Vulnerable NuGet packages remain in $project."
          }
        }
