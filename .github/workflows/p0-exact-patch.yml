name: P0 exact patch

on:
  push:
    branches: [ codex/p0-security-boundaries ]
    paths: [ .github/workflows/p0-exact-patch.yml ]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == '9529360-cpu/WPE-Agent' && github.ref == 'refs/heads/codex/p0-security-boundaries'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: codex/p0-security-boundaries
        fetch-depth: 0

    - name: Apply exact security replacements
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        function Replace-ExactlyOnce([string]$Path, [string]$Old, [string]$New) {
          $content = [System.IO.File]::ReadAllText($Path)
          $count = ([regex]::Matches($content, [regex]::Escape($Old))).Count
          if ($count -ne 1) { throw "Expected exactly one match in $Path, found $count." }
          $updated = $content.Replace($Old, $New)
          [System.IO.File]::WriteAllText($Path, $updated, [System.Text.UTF8Encoding]::new($false))
        }

        Replace-ExactlyOnce 'Services/BinanceApiClient.cs' `
          'var handler=new HttpClientHandler();' `
          'var handler=new HttpClientHandler{AllowAutoRedirect=false,UseCookies=false};'

        $oldMargin = 'public async Task SetMarginModeAsync(string symbol,bool isolated,CancellationToken ct) { try { _=await _api.PostSignedRawAsync("/fapi/v1/marginType",new Dictionary<string,string?>{{"symbol",N(symbol)},{"marginType",isolated?"ISOLATED":"CROSSED"}},ct); } catch(HttpRequestException ex) when(ex.Message.Contains("400")){} }'
        $newMargin = 'public async Task SetMarginModeAsync(string symbol,bool isolated,CancellationToken ct) { try { _=await _api.PostSignedRawAsync("/fapi/v1/marginType",new Dictionary<string,string?>{{"symbol",N(symbol)},{"marginType",isolated?"ISOLATED":"CROSSED"}},ct); } catch(global::币安量化机器人.Services.BinanceHttpException ex) when(ex.ExchangeCode==-4046){} }'
        Replace-ExactlyOnce 'Services/Agent/BinanceFuturesAdapter.cs' $oldMargin $newMargin

        $oldHedge = 'public async Task SetHedgeModeAsync(bool enabled,CancellationToken ct) { try { _=await _api.PostSignedRawAsync("/fapi/v1/positionSide/dual",new Dictionary<string,string?>{{"dualSidePosition",enabled?"true":"false"}},ct); } catch(HttpRequestException ex) when(ex.Message.Contains("400")){} }'
        $newHedge = 'public async Task SetHedgeModeAsync(bool enabled,CancellationToken ct) { try { _=await _api.PostSignedRawAsync("/fapi/v1/positionSide/dual",new Dictionary<string,string?>{{"dualSidePosition",enabled?"true":"false"}},ct); } catch(global::币安量化机器人.Services.BinanceHttpException ex) when(ex.ExchangeCode==-4059){} }'
        Replace-ExactlyOnce 'Services/Agent/BinanceFuturesAdapter.cs' $oldHedge $newHedge

        git diff --check
        git diff -- Services/BinanceApiClient.cs Services/Agent/BinanceFuturesAdapter.cs

    - name: Commit exact patch
      shell: pwsh
      run: |
        git config user.name "WPE security patch bot"
        git config user.email "security-patch@users.noreply.github.com"
        git add -- Services/BinanceApiClient.cs Services/Agent/BinanceFuturesAdapter.cs
        if (git diff --cached --quiet) { throw 'Expected security patch produced no changes.' }
        git commit -m "security: fail closed on Binance transport and mode errors"
        git push origin HEAD:codex/p0-security-boundaries
