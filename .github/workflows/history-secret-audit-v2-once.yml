name: History secret audit v2 once

on:
  push:
    branches: [ codex/security-history-secret-audit-v2 ]

permissions:
  contents: read

jobs:
  scan-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Fetch all public branch history
      shell: bash
      run: |
        set -euo pipefail
        git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

    - name: Install verified Gitleaks 8.30.1
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
        echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
        "$RUNNER_TEMP/gitleaks" version

    - name: Scan all reachable history with fully redacted findings
      shell: bash
      run: |
        set -euo pipefail
        set +e
        "$RUNNER_TEMP/gitleaks" git . \
          --redact=100 \
          --no-banner \
          --report-format json \
          --report-path "$RUNNER_TEMP/gitleaks.json" \
          --exit-code 2 \
          --log-opts='--all --full-history'
        code=$?
        set -e
        if [ "$code" -eq 0 ]; then
          echo 'No Gitleaks findings in reachable repository history.'
          exit 0
        fi
        if [ "$code" -ne 2 ]; then
          echo "Gitleaks failed to execute correctly (exit $code)."
          exit "$code"
        fi
        jq '[.[] | {RuleID,Description,File,StartLine,Commit:(.Commit[0:12]),Fingerprint}]' \
          "$RUNNER_TEMP/gitleaks.json" > "$RUNNER_TEMP/gitleaks-sanitized.json"
        count=$(jq 'length' "$RUNNER_TEMP/gitleaks-sanitized.json")
        echo "Gitleaks reported $count fully-redacted finding(s)."
        jq -r '.[] | "rule=\(.RuleID) file=\(.File) line=\(.StartLine) commit=\(.Commit)"' \
          "$RUNNER_TEMP/gitleaks-sanitized.json"
        exit 2

    - name: Upload sanitized finding metadata
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: gitleaks-sanitized-findings
        path: ${{ runner.temp }}/gitleaks-sanitized.json
        if-no-files-found: ignore
        retention-days: 1
